<!doctype html>
<!--
  LIT: Lessons In Typing - this page is only the "frame": empty pages that the JavaScript fills in.
  The lesson (the touch-typing page, keys, finger advice, practice sentences), the keyboard and all the wording
  live in lessons/, keyboards/ and lang/, so this file has no text of its own. data-t="<key>" marks a word from
  lang/<language>.json, which the EduGame Kit's helper fills in. The helper also adds the header at the top: the
  lesson's title and the Options button.

  Pages, in order:
    Page 1  What is touch typing?     (the lesson's "touchTyping" text; left out when a lesson has none)
    Page 2  The new keys and fingers
    Page 3  Typing practice
    Page 4  Results

  This file is shared by every lesson. "edugame build" puts it, with each lesson's files, into a zip.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIT: Lessons In Typing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <!-- Page 1: what is touch typing? -->
  <section id="page-touch" hidden>
    <div id="touchBody"></div>
    <div class="buttons">
      <button type="button" id="touchNext" class="primary" data-t="next"></button>
    </div>
  </section>

  <!-- Page 2: the new keys and which finger to use -->
  <section id="page-keys" hidden>
    <div id="keysBody"></div>
    <div class="buttons">
      <button type="button" id="startBtn" class="primary" data-t="start"></button>
      <button type="button" id="keysBack" data-t="back"></button>
    </div>
  </section>

  <!-- Page 3: typing practice -->
  <section id="page-practice" hidden>
    <div id="practiceTop">
      <p id="progressText"></p>
      <span id="capsWarning" hidden></span>
      <span id="timer">0:00</span>
    </div>
    <p id="strictNote" hidden></p>
    <p id="listName" hidden></p>
    <div id="sentence" aria-live="off"></div>
    <!-- Always takes up space (hidden with CSS visibility) so showing it never moves the buttons -->
    <p id="focusHint" data-t="clickToType"></p>
    <div id="practiceKeyboard" class="keyboard"></div>
    <div class="buttons">
      <button type="button" id="practiceBack" data-t="backToKeys"></button>
    </div>
  </section>

  <!-- Page 4: results -->
  <section id="page-results" hidden>
    <div id="resultsBody" aria-live="polite"></div>
    <div class="buttons">
      <button type="button" id="retryBtn" class="primary" data-t="tryAgain"></button>
      <button type="button" id="resultsBack" data-t="reviewKeys"></button>
    </div>
  </section>
</main>

<!-- Invisible box that receives the typing (also lets tablets show a keyboard) -->
<input id="capture" type="text" autocomplete="off" autocapitalize="off"
       autocorrect="off" spellcheck="false" data-t-attr="aria-label:typeHere">

<!-- ========== SCRIPTS (the order matters) ========== -->
<script src="edugame-config.js"></script> <!-- made by the EduGame Kit: the words (lang/), settings and this lesson -->
<script src="edugame.js"></script>        <!-- the kit's helper: saving, language, theme, the header and Options -->
<script src="js/core.js"></script>        <!-- shared TT object -->
<script src="config.js"></script>         <!-- settings and pass marks -->
<script src="js/prefs.js"></script>       <!-- the hands' skin tone, an option in the Options panel -->
<script src="js/engine.js"></script>      <!-- typing logic (no screen code) -->
<script src="js/hand-art.js"></script>    <!-- hand outline shapes (SVG path data) -->
<script src="js/hands.js"></script>       <!-- places and colours the two hand pictures -->
<script src="js/progress.js"></script>    <!-- the best result, kept by the kit's helper -->
<script src="js/loader.js"></script>      <!-- loads this lesson and keyboard in the learner's language, then js/app.js -->
</body>
</html>
