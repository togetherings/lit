# Checks every lesson and builds the zips with EduGame Kit on every push and pull request.
# When a release is published on GitHub's Releases page (tag vX.Y.Z, matching "version" in edugame.json),
# the zips are attached to it: one per lesson with every language, and one per lesson and language.
name: Build lessons

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # needed only to attach the zips to a release

env:
  KIT_VERSION: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the lessons (a sentence using an untaught key, a key with no finger ... fails the build)
        run: node tests/check_lessons.js
      - run: pip install "edugame-kit @ git+https://github.com/togetherings/edugame-kit@${KIT_VERSION}"
      - name: Check the game (words, packages)
        run: edugame check .
      - name: Build every zip
        run: |
          edugame build . -o dist                     # each lesson, every language
          edugame build . -o dist --each-language     # each lesson, one language
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: lit-zips
          path: dist/*.zip
      - name: The tag must match the version in edugame.json
        if: github.event_name == 'release'
        run: test "v$(python3 -c 'import json; print(json.load(open("edugame.json"))["version"])')" = "$GITHUB_REF_NAME"
      - name: Attach the zips to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  # The one check the "Protect main" ruleset requires in every togetherings repository: it passes only when
  # every job above passed, so tests can be added or renamed without changing the ruleset.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
