# Checks every lesson and builds the Kolibri zips on every push and pull request.
# When you push a tag such as v022 (it must match the VERSION file), the zips are also attached to a GitHub Release.
name: Build lessons

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write      # needed only to create the release on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the lessons (a sentence using an untaught key, a key with no finger ... fails the build)
        run: node tests/check_lessons.js
      - name: Build every zip
        run: python3 build.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: lit-zips
          path: dist/*.zip
      - name: The tag must match the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "LIT $GITHUB_REF_NAME" --generate-notes
