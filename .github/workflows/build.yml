# Checks every lesson and builds the zips, every time something is pushed. The steps are EduGame Kit's
# (its game.yml workflow), at the kit release named after "@": Dependabot (.github/dependabot.yml) opens a
# pull request here when a new kit release comes out, and these checks run on it.
#
#   * Every push: the zips are in the run's "Artifacts" (Actions tab > the run > game-zips), so you can try
#     them without installing anything. Kit / Browser plays every lesson and language on the kit's test page;
#     Kit / Real Kolibri plays lesson 1 in a real Kolibri (tests/kolibri_play.py).
#   * Publish a release (Releases > Draft a new release, with a tag like v0.24.0 that matches "version" in
#     edugame.json): a few bundles are attached to it (release-bundles), each a zip of the lesson zips:
#     lit-all-languages-<version>.zip, and one for each language like lit-en-<version>.zip.
name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # only used to attach the zips to a release

jobs:
  kit:
    name: Kit
    uses: togetherings/edugame-kit/.github/workflows/game.yml@v0.3.3
    with:
      # LIT's own check: a sentence using an untaught key, a key with no finger ... fails the build
      tests: node tests/check_lessons.js
      # Every lesson and language played on the kit's test page (Playwright)
      browser-tests: python -m tests.e2e_browser --screenshots screenshots
      # One zip per lesson and language too (in the run's Artifacts, game-zips)
      each-language: true
      # A release gets a few bundles (zips of the lesson zips) instead of every zip: one with every language, and one
      # for each language
      release-bundles: true
      # Every lesson is the same game with other words, so playing the first in Kolibri is enough
      kolibri-packages: 1

  # The name the "Protect main" ruleset asks for (see docs/platforms/GITHUB_PAGES.md in the kit): it passes only
  # when every job above passed. Add new jobs to "needs".
  checks-passed:
    name: Checks passed
    if: always()
    needs: [kit]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
